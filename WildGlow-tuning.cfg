## WildGlow 0.4.5 appearance preset.
## Merge these keys into matching sections of your existing config while Valheim is closed.
[Appearance]
VariantMode = Auto
Density = 0.6
Height = 2
Radius = 1
Speed = 0.9
Dust = 1
TrailLength = 2
Twist = 1.45
